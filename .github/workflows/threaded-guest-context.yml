name: Threaded ARM64 Guest Context

on:
  pull_request:
    paths:
      - 'CMakeLists.txt'
      - 'include/**'
      - 'src/**'
      - '.github/workflows/threaded-guest-context.yml'
  workflow_dispatch:

concurrency:
  group: threaded-guest-context-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  resolve-core-tester:
    name: Reuse Windows Core tester
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      reuse: ${{ steps.core.outputs.reuse }}
      run_id: ${{ steps.core.outputs.run_id }}

    steps:
      - name: Find exact-head Core artifact
        id: core
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          # Manual runs preserve the standalone build path. Pull-request runs
          # reuse the authoritative exact-head Core result whenever that workflow
          # was triggered, avoiding a second Windows compile for the same SHA.
          if [[ "${{ github.event_name }}" != 'pull_request' ]]; then
            echo 'reuse=false' >> "$GITHUB_OUTPUT"
            echo 'run_id=' >> "$GITHUB_OUTPUT"
            echo 'Manual Threaded run will use its standalone fallback build.'
            exit 0
          fi

          run_id=''
          for attempt in {1..9}; do
            runs_json="$(gh api -H 'Accept: application/vnd.github+json' \
              "repos/$GITHUB_REPOSITORY/actions/workflows/windows-arm64-core.yml/runs?head_sha=$TARGET_SHA&per_page=20")"
            run_id="$(jq -r '.workflow_runs[0].id // empty' <<<"$runs_json")"
            if [[ -n "$run_id" ]]; then
              break
            fi
            sleep 5
          done

          if [[ -z "$run_id" ]]; then
            echo 'reuse=false' >> "$GITHUB_OUTPUT"
            echo 'run_id=' >> "$GITHUB_OUTPUT"
            echo "No exact-head Windows ARM64 Core run exists for $TARGET_SHA; preserving the standalone fallback for a workflow-only PR."
            exit 0
          fi

          echo "Found Windows ARM64 Core run $run_id for $TARGET_SHA."
          while true; do
            run_json="$(gh api -H 'Accept: application/vnd.github+json' \
              "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")"
            status="$(jq -r '.status' <<<"$run_json")"
            conclusion="$(jq -r '.conclusion // empty' <<<"$run_json")"

            if [[ "$status" == 'completed' ]]; then
              if [[ "$conclusion" != 'success' ]]; then
                echo "Matching Windows ARM64 Core run $run_id completed as $conclusion; Threaded validation will not consume macOS/Windows runners." >&2
                exit 1
              fi
              break
            fi
            sleep 10
          done

          artifacts_json="$(gh api -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100")"
          artifact_id="$(jq -r '.artifacts[] | select(.name == "ipasim-ipa-tester" and .expired == false) | .id' <<<"$artifacts_json" | head -n1)"
          if [[ -z "$artifact_id" ]]; then
            echo "Successful Core run $run_id did not publish ipasim-ipa-tester." >&2
            exit 1
          fi

          echo 'reuse=true' >> "$GITHUB_OUTPUT"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Reusing tester artifact $artifact_id from Core run $run_id."

  build-arm64-fixture:
    name: Build ARM64 guest fixture
    needs: resolve-core-tester
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Build minimal iOS ARM64 Mach-O
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/threaded-guest"
          mkdir -p "$root"

          cat > "$root/ThreadedGuest.s" <<'ASM'
          .section __TEXT,__text,regular,pure_instructions
          .globl _main
          .p2align 2
          _main:
              mov w0, #42
              ret
          ASM

          xcrun --sdk iphoneos clang \
            -arch arm64 \
            -target arm64-apple-ios15.0 \
            -Wl,-e,_main \
            "$root/ThreadedGuest.s" \
            -o "$root/ThreadedGuest"

          system_dep="$(xcrun otool -L "$root/ThreadedGuest" | awk 'NR==2 {print $1}')"
          if [[ "$system_dep" != /usr/lib/libSystem* ]]; then
            echo "Expected libSystem dependency, got: $system_dep" >&2
            exit 1
          fi

          # This fixture exercises the emulator core without requiring Apple
          # runtime files: its only system dependency enters ipaSim's explicit
          # Windows Darwin-host bridge.
          xcrun install_name_tool -change "$system_dep" IpaSimDarwinHost.dll "$root/ThreadedGuest"
          xcrun otool -L "$root/ThreadedGuest"
          file "$root/ThreadedGuest"
          cp "$root/ThreadedGuest" "$GITHUB_WORKSPACE/ThreadedGuest"

      - name: Upload ARM64 guest fixture
        uses: actions/upload-artifact@v4
        with:
          name: threaded-arm64-guest
          if-no-files-found: error
          path: ThreadedGuest

  execute-on-windows:
    name: Execute on independent Windows guest CPU
    needs:
      - resolve-core-tester
      - build-arm64-fixture
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      SCCACHE_GHA_ENABLED: 'true'
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache

    steps:
      - name: Download exact-head Core tester
        if: needs.resolve-core-tester.outputs.reuse == 'true'
        uses: actions/download-artifact@v4
        with:
          name: ipasim-ipa-tester
          path: tester
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.resolve-core-tester.outputs.run_id }}

      - name: Check out ipaSim for manual standalone fallback
        if: needs.resolve-core-tester.outputs.reuse != 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fetch modern-core submodules for manual standalone fallback
        if: needs.resolve-core-tester.outputs.reuse != 'true'
        shell: pwsh
        run: |
          git submodule sync -- deps/llvm deps/LIEF deps/unicorn deps/Libffi
          git submodule update --init --depth 1 --jobs 4 deps/llvm deps/LIEF deps/unicorn deps/Libffi

      - name: Enter x64 MSVC environment for manual standalone fallback
        if: needs.resolve-core-tester.outputs.reuse != 'true'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Enable compiler result cache for manual standalone fallback
        if: needs.resolve-core-tester.outputs.reuse != 'true'
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.17.0

      - name: Configure modern core for manual standalone fallback
        if: needs.resolve-core-tester.outputs.reuse != 'true'
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja
          cmake --build build --target config-ipaSim-x64-Release -- -v

      - name: Build threaded probe path for manual standalone fallback
        if: needs.resolve-core-tester.outputs.reuse != 'true'
        shell: pwsh
        run: cmake --build build\ipaSim-x64-Release --target IpaProbe -- -v

      - name: Select ipaSim tester binaries
        shell: pwsh
        run: |
          if ('${{ needs.resolve-core-tester.outputs.reuse }}' -eq 'true') {
            $bin = (Resolve-Path 'tester').Path
            $source = 'Windows ARM64 Core artifact'
          } else {
            $bin = (Resolve-Path 'build\ipaSim-x64-Release\bin').Path
            $source = 'manual standalone fallback build'
          }

          $probe = Join-Path $bin 'IpaProbe.exe'
          if (-not (Test-Path $probe)) {
            throw "Expected threaded tester output not found: $probe"
          }
          "IPASIM_BIN=$bin" | Add-Content $env:GITHUB_ENV
          '## Threaded tester source' | Add-Content $env:GITHUB_STEP_SUMMARY
          $source | Add-Content $env:GITHUB_STEP_SUMMARY
          if ('${{ needs.resolve-core-tester.outputs.reuse }}' -eq 'true') {
            'Core run: ${{ needs.resolve-core-tester.outputs.run_id }}' | Add-Content $env:GITHUB_STEP_SUMMARY
          }

      - name: Download ARM64 guest fixture
        uses: actions/download-artifact@v4
        with:
          name: threaded-arm64-guest
          path: fixture

      - name: Execute guest on secondary Unicorn context
        shell: pwsh
        run: |
          $probe = Join-Path $env:IPASIM_BIN 'IpaProbe.exe'
          $image = (Resolve-Path 'fixture\ThreadedGuest').Path
          $lines = @(& $probe --execute-threaded $image 2>&1)
          $code = $LASTEXITCODE
          $lines | ForEach-Object { Write-Host $_ }

          if ($code -ne 0) {
            throw "Threaded guest execution failed with code $code"
          }
          if (($lines -join "`n") -notmatch 'threaded guest entry point returned X0=42') {
            throw 'Secondary ARM64 guest context did not return the expected X0=42 proof.'
          }

          '## Threaded ARM64 guest execution' | Add-Content $env:GITHUB_STEP_SUMMARY
          'A GitHub-built iOS ARM64 Mach-O was loaded once, its guest address space was replayed into an independent Unicorn engine on another Windows thread, and that engine returned X0=42.' | Add-Content $env:GITHUB_STEP_SUMMARY
