name: RuntimeRoot DwarFS Reader and Acceptance

on:
  pull_request:
    paths:
      - 'include/ipasim/DynamicLoader.hpp'
      - 'include/ipasim/DwarfsReaderBridgeApi.h'
      - 'include/ipasim/DwarfsRuntimeRootStore.hpp'
      - 'include/ipasim/Probe.hpp'
      - 'src/IpaSimulator/CMakeLists.txt'
      - 'src/IpaSimulator/DwarfsReaderBridge.cpp'
      - 'src/IpaSimulator/DwarfsRuntimeRootStore.cpp'
      - 'src/IpaSimulator/DwarfsRuntimeRootStoreSmoke.cpp'
      - 'src/IpaSimulator/HostImportInventory.hpp'
      - 'src/IpaSimulator/HostImportInventoryV2.hpp'
      - 'src/IpaSimulator/IpaProbe.cpp'
      - 'src/IpaSimulator/IpaSimulator.cpp'
      - 'src/IpaSimulator/RuntimeRootImageSource.hpp'
      - 'src/IpaSimulator/StaticSymbolAudit.hpp'
      - 'src/IpaSimulator/StaticSymbolAuditLegacyDyldInfo.hpp'
      - 'src/IpaSimulator/StaticSymbolAuditSelfTest.hpp'
      - 'src/IpaSimulator/dwarfs-reader/**'
      - 'tools/ci/build-dwarfs-fixture.sh'
      - 'tools/ci/build-dwarfs-reader.ps1'
      - 'tools/ci/build-runtime-dwarfs.sh'
      - 'tools/ci/resolve-core-tester.sh'
      - 'tools/ci/run-runtime-root-phase.ps1'
      - 'tools/ci/dwarfs-diagnostic.js'
      - '.github/workflows/runtime-root-dwarfs-reader.yml'
  workflow_dispatch:

concurrency:
  group: runtime-root-dwarfs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  pull-requests: write

env:
  AWS_IPA_COMMIT: 58e48234db510bd4fbf643643e8808c5d6a13845
  AWS_IPA_BLOB: 06a33a39286ffd7c9d300c5924750b6f97c4e346
  AWS_IPA_SIZE: '2138167'
  RUNTIME_XCODE_PATH: /Applications/Xcode_16.4.app
  RUNTIME_IOS_VERSION: '18.5'
  RUNTIME_IOS_BUILD: 22F77
  DWARFS_VERSION: '0.15.7'
  DWARFS_SOURCE_SHA256: 363c7fdbf7bad490a6b8d63186da8643c1aeb17ca54cce1193d7b0ebc57bc6bd
  DWARFS_UNIVERSAL_SHA256: baa03026e7d2c195fdb78bf261cd7d20f620b20685f8a3e26162ba9d652b0d78
  VCPKG_BASELINE: 62159a45e18f3a9ac0548628dcaf74fcb60c6ff9
  RUNTIME_DWARFS_CACHE_KEY: ipasim-github-runtime-macos15-xcode16.4-ios18.5-22F77-dwarfs0157-v1

jobs:
  build-fixture:
    name: Build Darwin-only DwarFS fixture
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out ipaSim
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build fixture image
        id: fixture
        continue-on-error: true
        shell: bash
        run: >-
          bash tools/ci/build-dwarfs-fixture.sh
          "$RUNNER_TEMP/runtime-root-illegal-name.dwarfs"
          "$RUNNER_TEMP/dwarfs-fixture.log"

      - name: Upload fixture
        if: steps.fixture.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: runtime-root-dwarfs-fixture
          path: ${{ runner.temp }}/runtime-root-illegal-name.dwarfs
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Publish fixture failure
        if: steps.fixture.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          DIAGNOSTIC_STAGE: Darwin-only DwarFS fixture generation
          DIAGNOSTIC_OUTCOME: ${{ steps.fixture.outcome }}
          DIAGNOSTIC_LOG: ${{ runner.temp }}/dwarfs-fixture.log
        with:
          script: |
            const run = require(process.env.GITHUB_WORKSPACE + '/tools/ci/dwarfs-diagnostic.js');
            await run({ github, context, core });

      - name: Fail after fixture diagnostic
        if: steps.fixture.outcome == 'failure'
        shell: bash
        run: exit 1

  reader-smoke:
    name: Windows in-image reader smoke
    needs:
      - build-fixture
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - name: Check out ipaSim
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download fixture
        uses: actions/download-artifact@v4
        with:
          name: runtime-root-dwarfs-fixture
          path: ${{ runner.temp }}\fixture

      - name: Enter x64 MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Capture reader toolchain identity
        id: toolchain
        shell: pwsh
        run: |
          $Compiler = (Get-Command cl.exe -ErrorAction Stop).Source
          $Version = (Get-Item -LiteralPath $Compiler).VersionInfo.FileVersion
          if ([string]::IsNullOrWhiteSpace($Version)) {
            throw "MSVC file version is unavailable: $Compiler"
          }
          "msvc_version=$Version" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          Write-Host "MSVC compiler: $Compiler ($Version)"

      - name: Restore validated DwarFS reader package cache
        id: reader_cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\dwarfs-reader-cache
          key: dwarfs-reader-v1-${{ runner.os }}-x64-msvc-${{ steps.toolchain.outputs.msvc_version }}-dwarfs-${{ env.DWARFS_VERSION }}-${{ env.DWARFS_SOURCE_SHA256 }}-vcpkg-${{ env.VCPKG_BASELINE }}-${{ hashFiles('include/ipasim/DwarfsReaderBridgeApi.h', 'include/ipasim/DwarfsRuntimeRootStore.hpp', 'src/IpaSimulator/DwarfsReaderBridge.cpp', 'src/IpaSimulator/DwarfsRuntimeRootStore.cpp', 'src/IpaSimulator/DwarfsRuntimeRootStoreSmoke.cpp', 'src/IpaSimulator/dwarfs-reader/**', 'tools/ci/build-dwarfs-reader.ps1') }}

      - name: Restore DwarFS vcpkg binary cache
        if: steps.reader_cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\vcpkg-bincache
          key: dwarfs-v0.15.7-source-vcpkg-62159a45-x64-windows-static-v2
          save-always: true

      - name: Build and validate DwarFS reader bridge
        id: smoke
        continue-on-error: true
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\tools\ci\build-dwarfs-reader.ps1" `
            -Fixture "$env:RUNNER_TEMP\fixture\runtime-root-illegal-name.dwarfs" `
            -BridgeOutput "$env:GITHUB_WORKSPACE\IpaSimDwarfsReader.dll" `
            -ReaderCacheRoot "$env:RUNNER_TEMP\dwarfs-reader-cache" `
            -Log "$env:RUNNER_TEMP\dwarfs-reader-smoke.log"

      - name: Publish reader failure
        if: steps.smoke.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          DIAGNOSTIC_STAGE: Windows in-image DwarFS reader smoke
          DIAGNOSTIC_OUTCOME: ${{ steps.smoke.outcome }}
          DIAGNOSTIC_LOG: ${{ runner.temp }}/dwarfs-reader-smoke.log
        with:
          script: |
            const run = require(process.env.GITHUB_WORKSPACE + '/tools/ci/dwarfs-diagnostic.js');
            await run({ github, context, core });

      - name: Upload validated DwarFS reader bridge
        if: steps.smoke.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ipasim-dwarfs-reader-bridge
          path: IpaSimDwarfsReader.dll
          if-no-files-found: error
          retention-days: 7

      - name: Fail after reader diagnostic
        if: steps.smoke.outcome == 'failure'
        shell: pwsh
        run: exit 1

  resolve-core-tester:
    name: Resolve exact-head Windows Core tester
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      run_id: ${{ steps.resolve.outputs.run_id }}
    steps:
      - name: Check out ipaSim
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve successful exact-head Core artifact
        id: resolve
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash tools/ci/resolve-core-tester.sh "$RUNNER_TEMP/core-resolve.log"

      - name: Publish Core resolution failure
        if: steps.resolve.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          DIAGNOSTIC_STAGE: Exact-head Windows Core tester resolution
          DIAGNOSTIC_OUTCOME: ${{ steps.resolve.outcome }}
          DIAGNOSTIC_LOG: ${{ runner.temp }}/core-resolve.log
        with:
          script: |
            const run = require(process.env.GITHUB_WORKSPACE + '/tools/ci/dwarfs-diagnostic.js');
            await run({ github, context, core });

      - name: Fail after Core resolution diagnostic
        if: steps.resolve.outcome == 'failure'
        shell: bash
        run: exit 1

  runtime-image:
    name: Build complete pinned RuntimeRoot DwarFS image
    needs:
      - reader-smoke
    runs-on: macos-15
    timeout-minutes: 90
    outputs:
      image_sha256: ${{ steps.runtime.outputs.image_sha256 }}
      image_size: ${{ steps.runtime.outputs.image_size }}
      build_seconds: ${{ steps.runtime.outputs.build_seconds }}
      cache_reused: ${{ steps.runtime.outputs.cache_reused }}
    steps:
      - name: Check out ipaSim
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Restore complete RuntimeRoot DwarFS cache
        id: runtime_cache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: ipasim-runtime-dwarfs
          key: ${{ env.RUNTIME_DWARFS_CACHE_KEY }}
          enableCrossOsArchive: true

      - name: Build or verify complete RuntimeRoot DwarFS image
        id: runtime
        continue-on-error: true
        shell: bash
        run: >-
          bash tools/ci/build-runtime-dwarfs.sh
          "$GITHUB_WORKSPACE/ipasim-runtime-dwarfs/RuntimeRoot.dwarfs"
          "$RUNNER_TEMP/runtime-dwarfs-source.log"

      - name: Save complete RuntimeRoot DwarFS cache
        id: runtime_cache_save
        if: steps.runtime.outcome == 'success' && steps.runtime_cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ipasim-runtime-dwarfs
          key: ${{ env.RUNTIME_DWARFS_CACHE_KEY }}
          enableCrossOsArchive: true

      - name: Publish RuntimeRoot preparation failure
        if: >-
          github.event_name == 'pull_request' &&
          (steps.runtime_cache.outcome == 'failure' ||
           steps.runtime.outcome == 'failure' ||
           steps.runtime_cache_save.outcome == 'failure')
        uses: actions/github-script@v7
        env:
          DIAGNOSTIC_STAGE: Complete macOS RuntimeRoot DwarFS preparation
          DIAGNOSTIC_OUTCOME: failure
          DIAGNOSTIC_LOG: ${{ runner.temp }}/runtime-dwarfs-source.log
        with:
          script: |
            const run = require(process.env.GITHUB_WORKSPACE + '/tools/ci/dwarfs-diagnostic.js');
            await run({ github, context, core });

      - name: Publish RuntimeRoot image summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Complete RuntimeRoot DwarFS image'
            echo
            echo "- Runtime: iOS $RUNTIME_IOS_VERSION ($RUNTIME_IOS_BUILD)"
            echo "- DwarFS: $DWARFS_VERSION"
            echo "- Cache restore hit: ${{ steps.runtime_cache.outputs.cache-hit }}"
            echo "- Image SHA-256: ${{ steps.runtime.outputs.image_sha256 }}"
            echo "- Image bytes: ${{ steps.runtime.outputs.image_size }}"
            echo "- First image build seconds: ${{ steps.runtime.outputs.build_seconds }}"
            echo "- Image reused by builder: ${{ steps.runtime.outputs.cache_reused }}"
            echo '- RuntimeRoot mount/extraction: none'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail after RuntimeRoot preparation diagnostic
        if: >-
          steps.runtime_cache.outcome == 'failure' ||
          steps.runtime.outcome == 'failure' ||
          steps.runtime_cache_save.outcome == 'failure'
        shell: bash
        run: exit 1

  dwarfs-boundary:
    name: Validate complete DwarFS RuntimeRoot loader boundary
    needs:
      - reader-smoke
      - runtime-image
      - resolve-core-tester
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - name: Check out ipaSim
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download exact-head Core tester
        uses: actions/download-artifact@v4
        with:
          name: ipasim-ipa-tester
          path: tester
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.resolve-core-tester.outputs.run_id }}

      - name: Download validated DwarFS reader bridge
        uses: actions/download-artifact@v4
        with:
          name: ipasim-dwarfs-reader-bridge
          path: reader-bridge

      - name: Restore complete DwarFS RuntimeRoot cache
        id: runtime_cache_windows
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: ipasim-runtime-dwarfs
          key: ${{ env.RUNTIME_DWARFS_CACHE_KEY }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      - name: Run exact-head DwarFS loader acceptance
        id: acceptance
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\tools\ci\run-runtime-root-phase.ps1" `
            -TesterRoot "$env:GITHUB_WORKSPACE\tester" `
            -Image "$env:GITHUB_WORKSPACE\ipasim-runtime-dwarfs\RuntimeRoot.dwarfs" `
            -ExpectedImageSha256 '${{ needs.runtime-image.outputs.image_sha256 }}' `
            -ExpectedImageSize '${{ needs.runtime-image.outputs.image_size }}' `
            -ReaderBridge "$env:GITHUB_WORKSPACE\reader-bridge\IpaSimDwarfsReader.dll" `
            -Log "$env:RUNNER_TEMP\runtime-dwarfs-acceptance.log"

      - name: Publish full RuntimeRoot storage result
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          DIAGNOSTIC_STAGE: Full RuntimeRoot DwarFS storage acceptance
          DIAGNOSTIC_OUTCOME: ${{ steps.acceptance.outcome }}
          DIAGNOSTIC_REPORT_SUCCESS: 'true'
          DIAGNOSTIC_LOG: ${{ runner.temp }}/runtime-dwarfs-acceptance.log
          DIAGNOSTIC_SUCCESS_BODY: >-
            The complete pinned iOS 18.5 (22F77) RuntimeRoot remained one DwarFS image
            for the exact-head image-backed probe. Static closure and host-import
            preflights read that same configured RuntimeRootStore before the loader
            reached a genuine symbol/chained-fixup boundary. The DwarFS runtime path
            used no RuntimeRoot mount, extraction, path exclusion, or path rewriting.
        with:
          script: |
            const run = require(process.env.GITHUB_WORKSPACE + '/tools/ci/dwarfs-diagnostic.js');
            await run({ github, context, core });

      - name: Publish Windows acceptance summary
        if: always()
        shell: pwsh
        run: |
          @"
          ## Windows DwarFS RuntimeRoot storage acceptance

          - Exact-head Core run: ${{ needs.resolve-core-tester.outputs.run_id }}
          - DwarFS RuntimeRoot cache hit: ${{ steps.runtime_cache_windows.outputs.cache-hit }}
          - DwarFS RuntimeRoot SHA-256: ${{ needs.runtime-image.outputs.image_sha256 }}
          - DwarFS RuntimeRoot bytes: ${{ needs.runtime-image.outputs.image_size }}
          - DwarFS RuntimeRoot extraction: none
          - Probe exit code: ${{ steps.acceptance.outputs.exit_code }}
          - Store-backed static closure preflight: ${{ steps.acceptance.outputs.static_closure_preflight }}
          - Store-backed host-import preflight: ${{ steps.acceptance.outputs.host_import_preflight }}
          - Canonical boundary: ${{ steps.acceptance.outputs.boundary_text }}
          - Storage acceptance outcome: ${{ steps.acceptance.outcome }}
          "@ | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Fail after publishing RuntimeRoot storage diagnostic
        if: >-
          steps.runtime_cache_windows.outcome == 'failure' ||
          steps.acceptance.outcome == 'failure'
        shell: pwsh
        run: exit 1
