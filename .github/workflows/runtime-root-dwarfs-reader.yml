name: RuntimeRoot DwarFS Reader and Acceptance

on:
  pull_request:
    paths:
      - 'include/ipasim/DynamicLoader.hpp'
      - 'include/ipasim/DwarfsReaderBridgeApi.h'
      - 'include/ipasim/DwarfsRuntimeRootStore.hpp'
      - 'include/ipasim/Probe.hpp'
      - 'src/IpaSimulator/CMakeLists.txt'
      - 'src/IpaSimulator/DwarfsReaderBridge.cpp'
      - 'src/IpaSimulator/DwarfsRuntimeRootStore.cpp'
      - 'src/IpaSimulator/DwarfsRuntimeRootStoreSmoke.cpp'
      - 'src/IpaSimulator/IpaProbe.cpp'
      - 'src/IpaSimulator/IpaSimulator.cpp'
      - 'src/IpaSimulator/dwarfs-reader/**'
      - '.github/workflows/runtime-root-dwarfs-reader.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: write

env:
  AWS_IPA_COMMIT: 58e48234db510bd4fbf643643e8808c5d6a13845
  AWS_IPA_BLOB: 06a33a39286ffd7c9d300c5924750b6f97c4e346
  AWS_IPA_SIZE: '2138167'
  RUNTIME_XCODE_PATH: /Applications/Xcode_16.4.app
  RUNTIME_IOS_VERSION: '18.5'
  RUNTIME_IOS_BUILD: 22F77
  DWARFS_VERSION: '0.15.7'
  RUNTIME_DWARFS_CACHE_KEY: ipasim-github-runtime-macos15-xcode16.4-ios18.5-22F77-dwarfs0157-v1

jobs:
  build-fixture:
    name: Build Darwin-only DwarFS fixture
    runs-on: ubuntu-latest
    steps:
      - name: Build fixture image
        id: fixture
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/dwarfs-fixture.log"
          exec > >(tee "$LOG") 2>&1

          DWARFS_VERSION=0.15.7
          DWARFS_SHA=baa03026e7d2c195fdb78bf261cd7d20f620b20685f8a3e26162ba9d652b0d78
          DWARFS="$RUNNER_TEMP/dwarfs-universal-${DWARFS_VERSION}-Linux-x86_64"
          FIXTURE_ROOT="$RUNNER_TEMP/runtime-root-fixture"
          FIXTURE_IMAGE="$RUNNER_TEMP/runtime-root-illegal-name.dwarfs"

          curl --fail --location --retry 3 \
            "https://github.com/mhx/dwarfs/releases/download/v${DWARFS_VERSION}/dwarfs-universal-${DWARFS_VERSION}-Linux-x86_64" \
            --output "$DWARFS"
          echo "${DWARFS_SHA}  ${DWARFS}" | sha256sum --check --strict
          chmod +x "$DWARFS"

          mkdir -p "$FIXTURE_ROOT/System/Library/Frameworks/UIKit.framework/Versions/A:"
          python3 - <<'PY'
          from pathlib import Path
          path = Path("${{ runner.temp }}") / "runtime-root-fixture" / "System" / "Library" / "Frameworks" / "UIKit.framework" / "Versions" / "A:" / "UIKit"
          path.write_bytes(bytes([0x49, 0x50, 0x41, 0x53, 0x69, 0x6d, 0x00, 0xff, 0x2f, 0x3a, 0x7f]))
          PY

          "$DWARFS" --tool=mkdwarfs -i "$FIXTURE_ROOT" -o "$FIXTURE_IMAGE" --log-level=warn
          "$DWARFS" --tool=dwarfsck "$FIXTURE_IMAGE" -l | tee "$RUNNER_TEMP/dwarfs-fixture-list.txt"
          grep -F 'System/Library/Frameworks/UIKit.framework/Versions/A:/UIKit' "$RUNNER_TEMP/dwarfs-fixture-list.txt"

          cp "$FIXTURE_IMAGE" "$GITHUB_WORKSPACE/runtime-root-illegal-name.dwarfs"

      - name: Upload fixture
        if: steps.fixture.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: runtime-root-dwarfs-fixture
          path: runtime-root-illegal-name.dwarfs
          if-no-files-found: error
          compression-level: 0

      - name: Publish fixture diagnostic
        if: steps.fixture.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          DIAGNOSTIC_LOG: ${{ runner.temp }}/dwarfs-fixture.log
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- ipasim-dwarfs-reader-diagnostic -->';
            const path = process.env.DIAGNOSTIC_LOG;
            const text = fs.existsSync(path) ? fs.readFileSync(path, 'utf8') : 'fixture log was not produced';
            const lines = text.split(/\r?\n/);
            const useful = lines.filter(line => /error|fatal|failed|exception|sha256|dwarfs|mkdwarfs/i.test(line)).slice(-80);
            const tail = lines.slice(-80);
            const body = `${marker}\n## RuntimeRoot DwarFS diagnostic\n\n**Fixture generation failed** on \`${context.sha}\`.\n\n### Useful output\n\`\`\`text\n${(useful.length ? useful : tail).join('\n').slice(-12000)}\n\`\`\`\n\nThe workflow still fails normally after publishing this diagnostic.`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });

      - name: Fail after fixture diagnostic
        if: steps.fixture.outcome == 'failure'
        shell: bash
        run: exit 1

  reader-smoke:
    name: Windows in-image reader smoke
    needs: build-fixture
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download fixture
        uses: actions/download-artifact@v4
        with:
          name: runtime-root-dwarfs-fixture
          path: ${{ runner.temp }}\fixture

      - name: Set MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\vcpkg-bincache
          key: dwarfs-v0.15.7-source-vcpkg-62159a45-x64-windows-static-v2
          save-always: true

      - name: Build and run DwarFS reader smoke
        id: smoke
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Log = Join-Path $env:RUNNER_TEMP 'dwarfs-reader-smoke.log'
          Set-Content -LiteralPath $Log -Value ''
          try {
            function Invoke-Native {
              param([Parameter(Mandatory=$true)][string]$Exe,
                    [Parameter(ValueFromRemainingArguments=$true)][string[]]$Arguments)
              & $Exe @Arguments 2>&1 | Tee-Object -FilePath $Log -Append
              $ExitCode = $LASTEXITCODE
              if ($ExitCode -ne 0) {
                throw "$Exe failed with exit code $ExitCode"
              }
            }

            $DwarfsVersion = '0.15.7'
            $DwarfsSourceSha = '363c7fdbf7bad490a6b8d63186da8643c1aeb17ca54cce1193d7b0ebc57bc6bd'
            $SourceArchive = Join-Path $env:RUNNER_TEMP "dwarfs-$DwarfsVersion.tar.xz"
            $SourceRoot = Join-Path $env:RUNNER_TEMP 'dwarfs-source'
            $DwarfsBuild = Join-Path $env:RUNNER_TEMP 'dwarfs-build'
            $DwarfsPrefix = Join-Path $env:RUNNER_TEMP 'dwarfs-prefix'
            $VcpkgRoot = Join-Path $env:RUNNER_TEMP 'vcpkg-dwarfs'
            $VcpkgInstalled = Join-Path $env:RUNNER_TEMP 'vcpkg-install-dwarfs'

            Invoke-WebRequest -Uri "https://github.com/mhx/dwarfs/releases/download/v$DwarfsVersion/dwarfs-$DwarfsVersion.tar.xz" -OutFile $SourceArchive
            $ActualSourceSha = (Get-FileHash -Algorithm SHA256 $SourceArchive).Hash.ToLowerInvariant()
            if ($ActualSourceSha -ne $DwarfsSourceSha) {
              throw "DwarFS source SHA-256 mismatch: expected $DwarfsSourceSha got $ActualSourceSha"
            }

            New-Item -ItemType Directory -Force -Path $SourceRoot | Out-Null
            Invoke-Native tar -xf $SourceArchive -C $SourceRoot
            $DwarfsSource = Get-ChildItem -Path $SourceRoot -Filter CMakeLists.txt -Recurse -File |
              Where-Object { Test-Path (Join-Path $_.Directory.FullName 'vcpkg.json') } |
              Select-Object -First 1 -ExpandProperty DirectoryName
            if ([string]::IsNullOrWhiteSpace($DwarfsSource)) {
              throw 'Pinned DwarFS source archive did not contain the expected CMake/vcpkg project root.'
            }
            "DwarFS source: $DwarfsSource" | Tee-Object -FilePath $Log -Append

            New-Item -ItemType Directory -Force -Path $VcpkgRoot | Out-Null
            Invoke-Native git -C $VcpkgRoot init
            Invoke-Native git -C $VcpkgRoot remote add origin https://github.com/microsoft/vcpkg.git
            Invoke-Native git -C $VcpkgRoot fetch origin 62159a45e18f3a9ac0548628dcaf74fcb60c6ff9
            Invoke-Native git -C $VcpkgRoot checkout --detach FETCH_HEAD
            Invoke-Native (Join-Path $VcpkgRoot 'bootstrap-vcpkg.bat') -disableMetrics

            $env:VCPKG_DEFAULT_BINARY_CACHE = Join-Path $env:RUNNER_TEMP 'vcpkg-bincache'
            New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
            $Toolchain = Join-Path $VcpkgRoot 'scripts\buildsystems\vcpkg.cmake'
            $Ninja = (Get-Command ninja.exe -ErrorAction Stop).Source
            "Ninja: $Ninja" | Tee-Object -FilePath $Log -Append

            $DwarfsConfigure = @(
              '-S', $DwarfsSource,
              '-B', $DwarfsBuild,
              '-G', 'Ninja',
              "-DCMAKE_MAKE_PROGRAM=$Ninja",
              '-DCMAKE_BUILD_TYPE=Release',
              "-DCMAKE_INSTALL_PREFIX=$DwarfsPrefix",
              "-DCMAKE_TOOLCHAIN_FILE=$Toolchain",
              '-DVCPKG_TARGET_TRIPLET=x64-windows-static',
              "-DVCPKG_INSTALLED_DIR=$VcpkgInstalled",
              '-DWITH_LIBDWARFS=ON',
              '-DWITH_TOOLS=OFF',
              '-DWITH_FUSE_DRIVER=OFF',
              '-DWITH_DESKTOP_INTEGRATION=OFF',
              '-DWITH_TESTS=OFF',
              '-DWITH_BENCHMARKS=OFF',
              '-DWITH_ALL_BENCHMARKS=OFF',
              '-DWITH_FUZZ=OFF',
              '-DWITH_MAN_OPTION=OFF',
              '-DWITH_UNIVERSAL_BINARY=OFF',
              '-DWITH_FUSE_EXTRACT_BINARY=OFF',
              '-DWITH_PXATTR=OFF',
              '-DWITH_EXAMPLE=OFF',
              '-DWITH_DEV_TOOLS=OFF',
              '-DENABLE_STACKTRACE=OFF'
            )
            Invoke-Native cmake @DwarfsConfigure
            Invoke-Native cmake --build $DwarfsBuild --target install

            $Config = Get-ChildItem -Path $DwarfsPrefix -Filter dwarfs-config.cmake -Recurse -File | Select-Object -First 1
            if ($null -eq $Config) {
              throw 'Pinned DwarFS source build completed without installing dwarfs-config.cmake.'
            }
            "Installed DwarFS CMake package: $($Config.FullName)" | Tee-Object -FilePath $Log -Append

            $BuildDir = Join-Path $env:RUNNER_TEMP 'ipasim-dwarfs-reader-build'
            $ProofConfigure = @(
              '-S', "$env:GITHUB_WORKSPACE\src\IpaSimulator\dwarfs-reader",
              '-B', $BuildDir,
              '-G', 'Ninja',
              "-DCMAKE_MAKE_PROGRAM=$Ninja",
              '-DCMAKE_BUILD_TYPE=Release',
              "-DCMAKE_TOOLCHAIN_FILE=$Toolchain",
              '-DVCPKG_TARGET_TRIPLET=x64-windows-static',
              "-DVCPKG_INSTALLED_DIR=$VcpkgInstalled",
              '-DVCPKG_MANIFEST_MODE=OFF',
              "-DCMAKE_PREFIX_PATH=$DwarfsPrefix"
            )
            Invoke-Native cmake @ProofConfigure
            Invoke-Native cmake --build $BuildDir --target DwarfsRuntimeRootStoreSmoke

            $Bridge = Join-Path $BuildDir 'bin\IpaSimDwarfsReader.dll'
            $Smoke = Join-Path $BuildDir 'bin\DwarfsRuntimeRootStoreSmoke.exe'
            $Fixture = Join-Path $env:RUNNER_TEMP 'fixture\runtime-root-illegal-name.dwarfs'
            foreach ($Required in @($Bridge, $Smoke, $Fixture)) {
              if (-not (Test-Path -LiteralPath $Required -PathType Leaf)) {
                throw "required reader-smoke input is missing: $Required"
              }
            }

            Invoke-Native $Smoke $Bridge $Fixture
          }
          catch {
            ($_ | Format-List * -Force | Out-String) | Tee-Object -FilePath $Log -Append | Write-Host
            throw
          }

      - name: Publish DwarFS reader result
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          DIAGNOSTIC_LOG: ${{ runner.temp }}/dwarfs-reader-smoke.log
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- ipasim-dwarfs-reader-diagnostic -->';
            const passed = process.env.SMOKE_OUTCOME === 'success';
            const path = process.env.DIAGNOSTIC_LOG;
            const text = fs.existsSync(path) ? fs.readFileSync(path, 'utf8') : 'reader smoke log was not produced';
            const lines = text.split(/\r?\n/);
            const useful = lines.filter(line => /error|fatal|failed|exception|cannot|missing|mismatch|does not|not found|required|read-tree|vcpkg|cmake|ninja|dwarfs|smoke/i.test(line)).slice(-140);
            const tail = lines.slice(-140);
            const excerpt = (useful.length ? useful : tail).join('\n').slice(-18000);
            const status = passed ? '✅ Windows in-image reader smoke passed' : '❌ Windows in-image reader smoke failed';
            const body = `${marker}\n## RuntimeRoot DwarFS diagnostic\n\n${status} on \`${context.sha}\`.\n\n${passed ? 'The bridge read the Darwin-only internal pathname directly from the DwarFS image without mounting or extracting it.' : '### Next actionable output\n```text\n' + excerpt + '\n```\n\nThe workflow still fails normally after publishing this diagnostic.'}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            else if (!passed) await github.rest.issues.createComment({ owner, repo, issue_number, body });

      - name: Upload validated DwarFS reader bridge
        if: steps.smoke.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ipasim-dwarfs-reader-bridge
          path: ${{ runner.temp }}\ipasim-dwarfs-reader-build\bin\IpaSimDwarfsReader.dll
          if-no-files-found: error
          retention-days: 7

      - name: Fail after publishing diagnostic
        if: steps.smoke.outcome == 'failure'
        shell: pwsh
        run: exit 1

  runtime-image:
    name: Build complete pinned RuntimeRoot DwarFS image
    runs-on: macos-15
    timeout-minutes: 90
    outputs:
      image_sha256: ${{ steps.verify.outputs.image_sha256 }}
      image_size: ${{ steps.verify.outputs.image_size }}

    steps:
      - name: Check out ipaSim
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Discover pinned RuntimeRoot and DwarFS tool
        id: discovery
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/runtime-dwarfs-source.log"
          : > "$log"
          exec > >(tee -a "$log") 2>&1

          if [[ ! -d "$RUNTIME_XCODE_PATH" ]]; then
            echo "ERROR: pinned Xcode is not installed: $RUNTIME_XCODE_PATH"
            exit 1
          fi
          sudo xcode-select -s "$RUNTIME_XCODE_PATH/Contents/Developer"
          xcodebuild -version

          runtime_json="$RUNNER_TEMP/simctl-runtimes.json"
          xcrun simctl list runtimes --json > "$runtime_json"
          runtime_record="$(python3 - "$runtime_json" "$RUNTIME_IOS_VERSION" "$RUNTIME_IOS_BUILD" <<'PY'
          import json
          import sys
          path, target_version, target_build = sys.argv[1:]
          with open(path, 'r', encoding='utf-8') as handle:
              data = json.load(handle)
          for runtime in data.get('runtimes', []):
              if runtime.get('version') == target_version and runtime.get('buildversion') == target_build and runtime.get('isAvailable') is not False:
                  bundle = runtime.get('bundlePath') or runtime.get('dataPath')
                  if bundle:
                      print(bundle)
                      sys.exit(0)
          print(f'pinned iOS runtime {target_version} ({target_build}) not found', file=sys.stderr)
          sys.exit(1)
          PY
          )"
          runtime_root="$runtime_record/Contents/Resources/RuntimeRoot"
          [[ -d "$runtime_root/System" && -d "$runtime_root/usr" ]] || { echo "ERROR: invalid RuntimeRoot: $runtime_root"; exit 1; }

          brew install dwarfs
          prefix="$(brew --prefix dwarfs)"
          mkdwarfs="$prefix/bin/mkdwarfs"
          dwarfsck="$prefix/bin/dwarfsck"
          for tool in "$mkdwarfs" "$dwarfsck"; do
            [[ -x "$tool" ]] || { echo "ERROR: DwarFS tool is missing: $tool"; exit 1; }
            "$tool" --version | grep -F "$DWARFS_VERSION"
          done

          echo "Pinned RuntimeRoot: $runtime_root"
          echo "runtime_root=$runtime_root" >> "$GITHUB_OUTPUT"
          echo "mkdwarfs=$mkdwarfs" >> "$GITHUB_OUTPUT"
          echo "dwarfsck=$dwarfsck" >> "$GITHUB_OUTPUT"

      - name: Restore complete RuntimeRoot DwarFS cache
        id: runtime_cache
        if: steps.discovery.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: ipasim-runtime-dwarfs
          key: ${{ env.RUNTIME_DWARFS_CACHE_KEY }}
          enableCrossOsArchive: true

      - name: Build complete DwarFS image on cache miss
        id: package
        if: >-
          steps.discovery.outcome == 'success' &&
          steps.runtime_cache.outcome == 'success' &&
          steps.runtime_cache.outputs.cache-hit != 'true'
        continue-on-error: true
        shell: bash
        env:
          RUNTIME_ROOT: ${{ steps.discovery.outputs.runtime_root }}
          MKDWARFS: ${{ steps.discovery.outputs.mkdwarfs }}
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/runtime-dwarfs-source.log"
          exec > >(tee -a "$log") 2>&1
          image_dir="$GITHUB_WORKSPACE/ipasim-runtime-dwarfs"
          image="$image_dir/RuntimeRoot.dwarfs"
          mkdir -p "$image_dir"
          rm -f "$image"
          echo "Building one DwarFS image from the complete iOS $RUNTIME_IOS_VERSION ($RUNTIME_IOS_BUILD) RuntimeRoot."
          echo 'No paths are excluded, renamed, sanitized, mounted, or extracted.'
          started="$(date +%s)"
          sudo "$MKDWARFS" -i "$RUNTIME_ROOT" -o "$image" --log-level=info
          finished="$(date +%s)"
          sudo chown "$(id -u):$(id -g)" "$image"
          chmod 600 "$image"
          [[ -s "$image" ]] || { echo 'ERROR: RuntimeRoot.dwarfs was not created.'; exit 1; }
          echo "DwarFS image build seconds: $((finished - started))"
          ls -lh "$image"

      - name: Verify complete DwarFS image
        id: verify
        if: >-
          steps.discovery.outcome == 'success' &&
          steps.runtime_cache.outcome == 'success' &&
          (steps.runtime_cache.outputs.cache-hit == 'true' || steps.package.outcome == 'success')
        continue-on-error: true
        shell: bash
        env:
          DWARFSCK: ${{ steps.discovery.outputs.dwarfsck }}
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/runtime-dwarfs-source.log"
          exec > >(tee -a "$log") 2>&1
          image="$GITHUB_WORKSPACE/ipasim-runtime-dwarfs/RuntimeRoot.dwarfs"
          [[ -s "$image" ]] || { echo "ERROR: RuntimeRoot.dwarfs is missing: $image"; exit 1; }
          "$DWARFSCK" "$image" --check-integrity
          sha="$(shasum -a 256 "$image" | awk '{print tolower($1)}')"
          size="$(stat -f '%z' "$image")"
          [[ "$sha" =~ ^[0-9a-f]{64}$ ]] || { echo "ERROR: invalid image SHA-256: $sha"; exit 1; }
          [[ "$size" =~ ^[0-9]+$ ]] || { echo "ERROR: invalid image size: $size"; exit 1; }
          echo "RuntimeRoot.dwarfs SHA-256: $sha"
          echo "RuntimeRoot.dwarfs bytes: $size"
          echo "image_sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "image_size=$size" >> "$GITHUB_OUTPUT"

      - name: Save complete RuntimeRoot DwarFS cache
        if: steps.runtime_cache.outputs.cache-hit != 'true' && steps.verify.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ipasim-runtime-dwarfs
          key: ${{ env.RUNTIME_DWARFS_CACHE_KEY }}
          enableCrossOsArchive: true

      - name: Publish RuntimeRoot image failure
        if: >-
          always() && github.event_name == 'pull_request' &&
          (steps.discovery.outcome == 'failure' ||
           steps.runtime_cache.outcome == 'failure' ||
           steps.package.outcome == 'failure' ||
           steps.verify.outcome == 'failure')
        uses: actions/github-script@v7
        env:
          DIAGNOSTIC_LOG: ${{ runner.temp }}/runtime-dwarfs-source.log
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- ipasim-dwarfs-reader-diagnostic -->';
            const text = fs.existsSync(process.env.DIAGNOSTIC_LOG) ? fs.readFileSync(process.env.DIAGNOSTIC_LOG, 'utf8') : 'RuntimeRoot source log was not produced';
            const lines = text.split(/\r?\n/);
            const useful = lines.filter(l => /error|fatal|failed|exception|permission|dwarfs|runtime|integrity|brew/i.test(l)).slice(-140);
            const excerpt = (useful.length ? useful : lines.slice(-140)).join('\n').slice(-18000);
            const body = `${marker}\n## RuntimeRoot DwarFS diagnostic\n\n❌ **Complete macOS RuntimeRoot image preparation failed** on \`${context.sha}\`.\n\n### Next actionable output\n\`\`\`text\n${excerpt}\n\`\`\`\n\nNo RuntimeRoot paths are excluded or rewritten. The workflow fails normally after publishing this diagnostic.`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });

      - name: Publish RuntimeRoot image summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Complete RuntimeRoot DwarFS image'
            echo
            echo "- Runtime: iOS $RUNTIME_IOS_VERSION ($RUNTIME_IOS_BUILD)"
            echo "- DwarFS: $DWARFS_VERSION"
            echo "- Cache key: $RUNTIME_DWARFS_CACHE_KEY"
            echo "- Cache hit: ${{ steps.runtime_cache.outputs.cache-hit }}"
            echo "- Image SHA-256: ${{ steps.verify.outputs.image_sha256 }}"
            echo "- Image bytes: ${{ steps.verify.outputs.image_size }}"
            echo '- RuntimeRoot extraction: none'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload RuntimeRoot source log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-dwarfs-source-log-${{ github.run_id }}
          path: ${{ runner.temp }}/runtime-dwarfs-source.log
          if-no-files-found: warn
          retention-days: 14

      - name: Fail after RuntimeRoot image diagnostic
        if: >-
          steps.discovery.outcome == 'failure' ||
          steps.runtime_cache.outcome == 'failure' ||
          steps.package.outcome == 'failure' ||
          steps.verify.outcome == 'failure'
        shell: bash
        run: exit 1

  resolve-core-tester:
    name: Resolve exact-head Windows Core tester
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      run_id: ${{ steps.resolve.outputs.run_id }}
    steps:
      - name: Find successful exact-head Core artifact
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          run_id=''
          for attempt in $(seq 1 45); do
            run_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/windows-arm64-core.yml/runs?head_sha=$TARGET_SHA&per_page=20" --jq '.workflow_runs[0].id // empty')"
            if [[ -n "$run_id" ]]; then break; fi
            echo "Exact-head Core run has not appeared yet ($attempt/45)."
            sleep 20
          done
          [[ -n "$run_id" ]] || { echo "ERROR: no Windows ARM64 Core run found for $TARGET_SHA"; exit 1; }
          for attempt in $(seq 1 60); do
            status="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq '.status')"
            conclusion="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq '.conclusion // empty')"
            echo "Core run $run_id: status=$status conclusion=${conclusion:-pending}"
            if [[ "$status" == 'completed' ]]; then
              [[ "$conclusion" == 'success' ]] || { echo "ERROR: exact-head Core run concluded $conclusion"; exit 1; }
              break
            fi
            sleep 15
          done
          status="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq '.status')"
          conclusion="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq '.conclusion // empty')"
          [[ "$status" == 'completed' && "$conclusion" == 'success' ]] || { echo 'ERROR: exact-head Core run did not complete successfully in time.'; exit 1; }
          artifact_count="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100" --jq '[.artifacts[] | select(.name == "ipasim-ipa-tester" and .expired == false)] | length')"
          [[ "$artifact_count" == '1' ]] || { echo "ERROR: expected one live ipasim-ipa-tester artifact, found $artifact_count"; exit 1; }
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

  windows-acceptance:
    name: Run pinned AWS IPA directly from DwarFS RuntimeRoot
    needs:
      - reader-smoke
      - runtime-image
      - resolve-core-tester
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      EXPECTED_IMAGE_SHA256: ${{ needs.runtime-image.outputs.image_sha256 }}
      EXPECTED_IMAGE_SIZE: ${{ needs.runtime-image.outputs.image_size }}

    steps:
      - name: Download exact-head Core tester
        uses: actions/download-artifact@v4
        with:
          name: ipasim-ipa-tester
          path: tester
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.resolve-core-tester.outputs.run_id }}

      - name: Download validated DwarFS reader bridge
        uses: actions/download-artifact@v4
        with:
          name: ipasim-dwarfs-reader-bridge
          path: reader-bridge

      - name: Restore complete DwarFS RuntimeRoot cache
        id: runtime_cache_windows
        uses: actions/cache/restore@v4
        with:
          path: ipasim-runtime-dwarfs
          key: ${{ env.RUNTIME_DWARFS_CACHE_KEY }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      - name: Verify image and run pinned public IPA
        id: acceptance
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Log = Join-Path $env:RUNNER_TEMP 'runtime-dwarfs-acceptance.log'
          Set-Content -LiteralPath $Log -Value ''
          function Invoke-Native {
            param([Parameter(Mandatory=$true)][string]$Exe,
                  [Parameter(ValueFromRemainingArguments=$true)][string[]]$Arguments)
            & $Exe @Arguments 2>&1 | Tee-Object -FilePath $Log -Append
            $ExitCode = $LASTEXITCODE
            if ($ExitCode -ne 0) { throw "$Exe failed with exit code $ExitCode" }
          }
          try {
            $Image = Join-Path $env:GITHUB_WORKSPACE 'ipasim-runtime-dwarfs\RuntimeRoot.dwarfs'
            if (-not (Test-Path -LiteralPath $Image -PathType Leaf)) { throw "RuntimeRoot DwarFS cache is missing: $Image" }
            $ActualSha = (Get-FileHash -LiteralPath $Image -Algorithm SHA256).Hash.ToLowerInvariant()
            $ExpectedSha = $env:EXPECTED_IMAGE_SHA256.Trim().ToLowerInvariant()
            $ActualSize = (Get-Item -LiteralPath $Image).Length
            if ($ActualSha -ne $ExpectedSha) { throw "RuntimeRoot.dwarfs SHA-256 mismatch: expected $ExpectedSha got $ActualSha" }
            if ($ActualSize -ne [int64]$env:EXPECTED_IMAGE_SIZE) { throw "RuntimeRoot.dwarfs size mismatch: expected $env:EXPECTED_IMAGE_SIZE got $ActualSize" }
            "RuntimeRoot.dwarfs verified: $ActualSha ($ActualSize bytes)" | Tee-Object -FilePath $Log -Append

            $Probe = Get-ChildItem -Path "$env:GITHUB_WORKSPACE\tester" -Filter IpaProbe.exe -Recurse -File | Select-Object -First 1
            if ($null -eq $Probe) { throw 'exact-head tester does not contain IpaProbe.exe' }
            $TesterDir = $Probe.Directory.FullName
            $Arm64Smoke = Join-Path $TesterDir 'Arm64Smoke.exe'
            if (-not (Test-Path -LiteralPath $Arm64Smoke -PathType Leaf)) { throw "exact-head tester does not contain Arm64Smoke.exe beside IpaProbe.exe: $TesterDir" }
            $Bridge = Get-ChildItem -Path "$env:GITHUB_WORKSPACE\reader-bridge" -Filter IpaSimDwarfsReader.dll -Recurse -File | Select-Object -First 1
            if ($null -eq $Bridge) { throw 'validated bridge artifact does not contain IpaSimDwarfsReader.dll' }

            $Ipa = Join-Path $env:RUNNER_TEMP 'AWSDeviceFarmSample.ipa'
            $Url = "https://raw.githubusercontent.com/aws-samples/aws-device-farm-sample-app-for-ios/$env:AWS_IPA_COMMIT/prebuilt/prebuiltSampleApp.ipa"
            Invoke-WebRequest -Uri $Url -OutFile $Ipa
            $Size = (Get-Item -LiteralPath $Ipa).Length
            if ($Size -ne [int64]$env:AWS_IPA_SIZE) { throw "AWS sample IPA size mismatch: expected $env:AWS_IPA_SIZE got $Size" }
            $ActualBlob = (& git hash-object -- $Ipa).Trim().ToLowerInvariant()
            if ($LASTEXITCODE -ne 0) { throw 'git hash-object failed for the AWS sample IPA' }
            if ($ActualBlob -ne $env:AWS_IPA_BLOB) { throw "AWS sample IPA blob mismatch: expected $env:AWS_IPA_BLOB got $ActualBlob" }
            "Pinned AWS IPA verified at upstream blob $ActualBlob." | Tee-Object -FilePath $Log -Append

            $Extract = Join-Path $env:RUNNER_TEMP 'aws-ipa-extracted'
            if (Test-Path -LiteralPath $Extract) { Remove-Item -LiteralPath $Extract -Recurse -Force }
            New-Item -ItemType Directory -Force -Path $Extract | Out-Null
            $Zip = Join-Path $env:RUNNER_TEMP 'AWSDeviceFarmSample.zip'
            Copy-Item -LiteralPath $Ipa -Destination $Zip -Force
            Expand-Archive -LiteralPath $Zip -DestinationPath $Extract -Force

            $Locator = Join-Path $env:RUNNER_TEMP 'locate-ipa-executable.py'
            @'
import pathlib
import plistlib
import sys
root = pathlib.Path(sys.argv[1])
apps = list((root / "Payload").glob("*.app"))
if len(apps) != 1:
    raise SystemExit(f"expected exactly one Payload/*.app, found {len(apps)}")
with (apps[0] / "Info.plist").open("rb") as handle:
    info = plistlib.load(handle)
name = info.get("CFBundleExecutable")
if not isinstance(name, str) or not name:
    raise SystemExit("Info.plist has no CFBundleExecutable")
exe = apps[0] / name
if not exe.is_file():
    raise SystemExit(f"CFBundleExecutable does not exist: {exe}")
print(exe)
'@ | Set-Content -LiteralPath $Locator -Encoding UTF8
            $AppExe = (& python $Locator $Extract).Trim()
            if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($AppExe)) { throw 'could not locate the pinned IPA executable' }
            "Pinned IPA executable: $AppExe" | Tee-Object -FilePath $Log -Append

            Invoke-Native $Arm64Smoke
            Invoke-Native $Probe.FullName $AppExe '--runtime-root-dwarfs' $Image $Bridge.FullName
          }
          catch {
            ($_ | Format-List * -Force | Out-String) | Tee-Object -FilePath $Log -Append | Write-Host
            throw
          }

      - name: Publish full DwarFS acceptance result
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          DIAGNOSTIC_LOG: ${{ runner.temp }}/runtime-dwarfs-acceptance.log
          ACCEPTANCE_OUTCOME: ${{ steps.acceptance.outcome }}
          IMAGE_SHA: ${{ needs.runtime-image.outputs.image_sha256 }}
          IMAGE_SIZE: ${{ needs.runtime-image.outputs.image_size }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- ipasim-dwarfs-reader-diagnostic -->';
            const passed = process.env.ACCEPTANCE_OUTCOME === 'success';
            const text = fs.existsSync(process.env.DIAGNOSTIC_LOG) ? fs.readFileSync(process.env.DIAGNOSTIC_LOG, 'utf8') : 'Windows acceptance log was not produced';
            const lines = text.split(/\r?\n/);
            const useful = lines.filter(l => /error|fatal|failed|exception|loader|runtime|dependency|symbol|dylib|framework|dwarfs|ipasim-probe|Mach-O/i.test(l)).slice(-180);
            const excerpt = (useful.length ? useful : lines.slice(-180)).join('\n').slice(-20000);
            const status = passed ? '✅ **Full DwarFS RuntimeRoot probe passed on real Windows.**' : '❌ **Full DwarFS RuntimeRoot probe reached a failing boundary on real Windows.**';
            const body = `${marker}\n## RuntimeRoot DwarFS diagnostic\n\n${status}\n\n- Runtime: iOS 18.5 (22F77)\n- DwarFS: 0.15.7\n- Image SHA-256: \`${process.env.IMAGE_SHA || 'n/a'}\`\n- Image bytes: ${process.env.IMAGE_SIZE || 'n/a'}\n- RuntimeRoot mount/extraction: **none**\n\n${passed ? 'The pinned public IPA was loaded through the exact-head Windows probe using bytes read directly from the single DwarFS image.' : '### Next actionable output\n```text\n' + excerpt + '\n```\n\nThis is the real loader diagnostic; no RuntimeRoot path is excluded, rewritten, or materialized as NTFS to make the test pass.'}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });

      - name: Publish Windows DwarFS summary
        if: always()
        shell: pwsh
        run: |
          @"
          ## Windows DwarFS RuntimeRoot acceptance

          - Exact-head Core run: ${{ needs.resolve-core-tester.outputs.run_id }}
          - RuntimeRoot cache hit: ${{ steps.runtime_cache_windows.outputs.cache-hit }}
          - RuntimeRoot SHA-256: ${{ needs.runtime-image.outputs.image_sha256 }}
          - RuntimeRoot bytes: ${{ needs.runtime-image.outputs.image_size }}
          - RuntimeRoot extraction: none
          - Probe outcome: ${{ steps.acceptance.outcome }}
          "@ | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Upload Windows acceptance log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-dwarfs-windows-log-${{ github.run_id }}
          path: ${{ runner.temp }}/runtime-dwarfs-acceptance.log
          if-no-files-found: warn
          retention-days: 14

      - name: Fail after publishing DwarFS acceptance diagnostic
        if: steps.acceptance.outcome == 'failure'
        shell: pwsh
        run: exit 1
