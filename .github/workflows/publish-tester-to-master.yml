name: Publish Windows Tester to Master

on:
  push:
    branches:
      - master

concurrency:
  group: publish-windows-tester-to-master
  cancel-in-progress: false

permissions:
  actions: read
  contents: write
  pull-requests: read

jobs:
  publish:
    if: ${{ !contains(github.event.head_commit.message, '[tester-snapshot]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 2

      - name: Find merged PR and its green Windows tester
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          pr_json="$(gh api -H 'Accept: application/vnd.github+json' "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls")"
          pr_number="$(jq -r '[.[] | select(.merged_at != null)] | first | .number // empty' <<<"$pr_json")"
          pr_head_sha="$(jq -r '[.[] | select(.merged_at != null)] | first | .head.sha // empty' <<<"$pr_json")"

          if [[ -z "$pr_number" || -z "$pr_head_sha" ]]; then
            echo 'No merged pull request is associated with this master commit; no tester snapshot will be published.'
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          runs_json="$(gh api -H 'Accept: application/vnd.github+json' "repos/$GITHUB_REPOSITORY/actions/workflows/windows-arm64-core.yml/runs?event=pull_request&status=success&head_sha=$pr_head_sha&per_page=20")"
          run_id="$(jq -r '.workflow_runs[0].id // empty' <<<"$runs_json")"
          if [[ -z "$run_id" ]]; then
            echo "Merged PR #$pr_number has no successful Windows ARM64 Core run for head $pr_head_sha; refusing to publish an unvalidated tester." >&2
            exit 1
          fi

          artifacts_json="$(gh api -H 'Accept: application/vnd.github+json' "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100")"
          artifact_id="$(jq -r '.artifacts[] | select(.name == "ipasim-ipa-tester" and .expired == false) | .id' <<<"$artifacts_json" | head -n1)"
          if [[ -z "$artifact_id" ]]; then
            echo "Windows ARM64 Core run $run_id has no current ipasim-ipa-tester artifact." >&2
            exit 1
          fi

          echo 'publish=true' >> "$GITHUB_OUTPUT"
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "pr_head_sha=$pr_head_sha" >> "$GITHUB_OUTPUT"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "artifact_id=$artifact_id" >> "$GITHUB_OUTPUT"

      - name: Copy existing artifact ZIP into repository
        if: steps.source.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.source.outputs.artifact_id }}
        run: |
          set -euo pipefail
          mkdir -p tester/windows/latest

          # GitHub Actions artifacts are already ZIP archives. Download the exact
          # existing archive bytes directly; do not extract and re-zip them.
          gh api \
            -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            > tester/windows/latest/ipasim-ipa-tester.zip

          test -s tester/windows/latest/ipasim-ipa-tester.zip
          unzip -t tester/windows/latest/ipasim-ipa-tester.zip >/dev/null

      - name: Record tester provenance
        if: steps.source.outputs.publish == 'true'
        shell: bash
        env:
          PR_NUMBER: ${{ steps.source.outputs.pr_number }}
          PR_HEAD_SHA: ${{ steps.source.outputs.pr_head_sha }}
          RUN_ID: ${{ steps.source.outputs.run_id }}
          ARTIFACT_ID: ${{ steps.source.outputs.artifact_id }}
        run: |
          set -euo pipefail
          sha256="$(sha256sum tester/windows/latest/ipasim-ipa-tester.zip | awk '{print $1}')"
          cat > tester/windows/latest/BUILD.txt <<EOF
          source_repository=$GITHUB_REPOSITORY
          merged_pr=$PR_NUMBER
          pr_head_sha=$PR_HEAD_SHA
          master_merge_sha=$GITHUB_SHA
          windows_core_run_id=$RUN_ID
          actions_artifact_id=$ARTIFACT_ID
          zip_sha256=$sha256
          published_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF

      - name: Commit rebuilt tester to master
        if: steps.source.outputs.publish == 'true'
        shell: bash
        env:
          PR_NUMBER: ${{ steps.source.outputs.pr_number }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tester/windows/latest/ipasim-ipa-tester.zip tester/windows/latest/BUILD.txt

          if git diff --cached --quiet; then
            echo 'Tester snapshot is already current.'
            exit 0
          fi

          git commit -m "Update Windows tester from PR #$PR_NUMBER [tester-snapshot]"
          git push origin HEAD:master
