name: Publish Windows Tester to Master

on:
  push:
    branches:
      - master

concurrency:
  group: publish-windows-tester-to-master
  cancel-in-progress: false

permissions:
  actions: read
  contents: write
  pull-requests: read

jobs:
  publish:
    if: ${{ !contains(github.event.head_commit.message, '[tester-snapshot]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 2

      - name: Select green Windows tester artifact
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          pr_json="$(gh api -H 'Accept: application/vnd.github+json' "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls")"
          pr_number="$(jq -r '[.[] | select(.merged_at != null)] | first | .number // empty' <<<"$pr_json")"
          pr_head_sha="$(jq -r '[.[] | select(.merged_at != null)] | first | .head.sha // empty' <<<"$pr_json")"

          run_id=''
          if [[ -n "$pr_head_sha" ]]; then
            runs_json="$(gh api -H 'Accept: application/vnd.github+json' "repos/$GITHUB_REPOSITORY/actions/workflows/windows-arm64-core.yml/runs?event=pull_request&status=success&head_sha=$pr_head_sha&per_page=20")"
            run_id="$(jq -r '.workflow_runs[0].id // empty' <<<"$runs_json")"
          fi

          if [[ -z "$run_id" ]]; then
            runs_json="$(gh api -H 'Accept: application/vnd.github+json' "repos/$GITHUB_REPOSITORY/actions/workflows/windows-arm64-core.yml/runs?event=pull_request&status=success&per_page=20")"
            run_id="$(jq -r '.workflow_runs[0].id // empty' <<<"$runs_json")"
          fi

          if [[ -z "$run_id" ]]; then
            echo 'No successful Windows ARM64 Core run is available.' >&2
            exit 1
          fi

          artifacts_json="$(gh api -H 'Accept: application/vnd.github+json' "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100")"
          artifact_id="$(jq -r '.artifacts[] | select(.name == "ipasim-ipa-tester" and .expired == false) | .id' <<<"$artifacts_json" | head -n1)"
          if [[ -z "$artifact_id" ]]; then
            echo "Windows ARM64 Core run $run_id has no current ipasim-ipa-tester artifact." >&2
            exit 1
          fi

          echo "pr_number=${pr_number:-none}" >> "$GITHUB_OUTPUT"
          echo "pr_head_sha=${pr_head_sha:-none}" >> "$GITHUB_OUTPUT"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "artifact_id=$artifact_id" >> "$GITHUB_OUTPUT"

      - name: Download existing artifact ZIP as-is
        id: zip
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.source.outputs.artifact_id }}
        run: |
          set -euo pipefail
          mkdir -p tester/windows/latest
          temp_zip="$RUNNER_TEMP/ipasim-ipa-tester.zip"

          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            --output "$temp_zip"

          test -s "$temp_zip"
          unzip -t "$temp_zip" >/dev/null

          new_hash="$(sha256sum "$temp_zip" | awk '{print $1}')"
          old_hash=''
          if [[ -f tester/windows/latest/ipasim-ipa-tester.zip ]]; then
            old_hash="$(sha256sum tester/windows/latest/ipasim-ipa-tester.zip | awk '{print $1}')"
          fi

          if [[ "$new_hash" == "$old_hash" ]]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo "sha256=$new_hash" >> "$GITHUB_OUTPUT"
            echo 'The committed tester ZIP already matches the latest green artifact.'
            exit 0
          fi

          mv "$temp_zip" tester/windows/latest/ipasim-ipa-tester.zip
          echo 'changed=true' >> "$GITHUB_OUTPUT"
          echo "sha256=$new_hash" >> "$GITHUB_OUTPUT"

      - name: Record tester provenance
        if: steps.zip.outputs.changed == 'true'
        shell: bash
        env:
          PR_NUMBER: ${{ steps.source.outputs.pr_number }}
          PR_HEAD_SHA: ${{ steps.source.outputs.pr_head_sha }}
          RUN_ID: ${{ steps.source.outputs.run_id }}
          ARTIFACT_ID: ${{ steps.source.outputs.artifact_id }}
          ZIP_SHA256: ${{ steps.zip.outputs.sha256 }}
        run: |
          set -euo pipefail
          cat > tester/windows/latest/BUILD.txt <<EOF
          source_repository=$GITHUB_REPOSITORY
          merged_pr=$PR_NUMBER
          pr_head_sha=$PR_HEAD_SHA
          master_sha_when_published=$GITHUB_SHA
          windows_core_run_id=$RUN_ID
          actions_artifact_id=$ARTIFACT_ID
          zip_sha256=$ZIP_SHA256
          published_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF

      - name: Commit tester ZIP to master
        if: steps.zip.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tester/windows/latest/ipasim-ipa-tester.zip tester/windows/latest/BUILD.txt
          git commit -m 'Update green Windows tester [tester-snapshot]'
          git push origin HEAD:master
